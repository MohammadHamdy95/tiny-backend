spring:
  application:
    name: tiny-backend
  mvc:
    problemdetails:
      enabled: true

shortener:
  public-url: ${TINY_PUBLIC_URL:https://tiny.hamdy.app}
  default-ttl-days: ${TINY_DEFAULT_TTL_DAYS:1825}
  table-name: ${TINY_TABLE_NAME:links}

aws:
  region: ${AWS_REGION:us-west-2}
  # Set to a DynamoDB Local endpoint in dev; empty = real AWS.
  dynamodb-endpoint: ${DYNAMODB_ENDPOINT:}
