openapi: 3.1.0
info:
  title: URL Shortener API
  version: 1.0.0-draft
  description: |
    API for s.hamdy.app. Anonymous by design: anyone can shorten a URL —
    no auth, no accounts, no tracking. Redirects live at the root
    (`/{slug}`); the API lives under `/api/v1` and is called same-origin
    by the frontend. Design rationale in docs/API.md.
servers:
  - url: https://s.hamdy.app
    description: production
  - url: http://s.localhost
    description: local dev (compose stack)
  - url: http://localhost:8080
    description: backend run directly

# Anonymous by design — no operation requires credentials.
security: []

tags:
  - name: redirect
  - name: links
  - name: meta

paths:
  /{slug}:
    get:
      tags: [redirect]
      operationId: redirect
      summary: Resolve a short link
      description: |
        302 to the target URL and atomically increment the click counter.
        Expired or unknown slugs return 404.
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '302':
          description: Redirect to the target URL
          headers:
            Location:
              schema: { type: string, format: uri }
            Cache-Control:
              schema: { type: string, const: 'no-store' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/links:
    post:
      tags: [links]
      operationId: createLink
      summary: Create a short link (anonymous)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLinkRequest' }
            examples:
              generated:
                value: { url: 'https://example.com/some/long/path' }
              custom:
                value: { url: 'https://example.com', slug: 'demo', expiresAt: '2027-01-01T00:00:00Z' }
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URL of the created resource (`/api/v1/links/{slug}`)
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Link' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Custom slug already in use or reserved
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/links/{slug}:
    get:
      tags: [links]
      operationId: getLink
      summary: Link details and stats
      description: Public — knowing the slug is the access, same as following it.
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: The link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Link' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/health:
    get:
      tags: [meta]
      operationId: health
      summary: Liveness probe
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }

components:
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,64}$'

  schemas:
    CreateLinkRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: Absolute http(s) URL to shorten
        slug:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
          description: Optional custom slug; generated (7-char base62) if omitted. Reserved words rejected with 409.
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: Optional expiry; defaults to 5 years from creation. Expired links 404 and are TTL-deleted

    Link:
      type: object
      required: [slug, url, shortUrl, createdAt, expiresAt, stats]
      properties:
        slug: { type: string }
        url: { type: string, format: uri }
        shortUrl: { type: string, format: uri, description: 'https://s.hamdy.app/{slug}' }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: Always set — default 5 years from creation }
        stats:
          type: object
          required: [clicks]
          properties:
            clicks: { type: integer }
            lastClickAt: { type: [string, 'null'], format: date-time }

    Problem:
      type: object
      description: RFC 9457 Problem Details
      required: [title, status]
      properties:
        type: { type: string, format: uri, default: 'about:blank' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

  responses:
    BadRequest:
      description: Malformed request (invalid URL, bad slug pattern, bad expiry)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No such (or expired) resource
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limited
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
