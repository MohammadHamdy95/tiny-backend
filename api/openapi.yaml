openapi: 3.1.0
info:
  title: URL Shortener API
  version: 1.0.0-draft
  description: |
    API for s.hamdy.app. Redirects live at the root (`/{slug}`); the
    management API lives under `/api/v1` and is called same-origin by the
    frontend. Design rationale in docs/API.md.
servers:
  - url: https://s.hamdy.app
    description: production
  - url: http://s.localhost
    description: local dev (compose stack)
  - url: http://localhost:8080
    description: backend run directly

tags:
  - name: redirect
  - name: links
  - name: meta

paths:
  /{slug}:
    get:
      tags: [redirect]
      operationId: redirect
      summary: Resolve a short link
      description: |
        302 to the target URL and atomically increment the click counter.
        Expired or unknown slugs return 404.
      security: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '302':
          description: Redirect to the target URL
          headers:
            Location:
              schema: { type: string, format: uri }
            Cache-Control:
              schema: { type: string, const: 'no-store' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/links:
    post:
      tags: [links]
      operationId: createLink
      summary: Create a short link
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLinkRequest' }
            examples:
              generated:
                value: { url: 'https://example.com/some/long/path' }
              custom:
                value: { url: 'https://example.com', slug: 'demo', expiresAt: '2027-01-01T00:00:00Z' }
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URL of the created resource (`/api/v1/links/{slug}`)
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Link' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Custom slug already in use or reserved
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      tags: [links]
      operationId: listLinks
      summary: List links
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of links, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Link' }
                  nextCursor:
                    type: [string, 'null']
                    description: Pass as `cursor` to fetch the next page; null on the last page
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/links/{slug}:
    get:
      tags: [links]
      operationId: getLink
      summary: Link details and stats
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: The link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Link' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [links]
      operationId: deleteLink
      summary: Delete a link
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '204': { description: Deleted (idempotent — also returned if already gone) }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/health:
    get:
      tags: [meta]
      operationId: health
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }

security:
  - adminToken: []

components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      description: Single admin token (SHORTENER_ADMIN_TOKEN)

  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,64}$'
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }

  schemas:
    CreateLinkRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: Absolute http(s) URL to shorten
        slug:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
          description: Optional custom slug; generated (7-char base62) if omitted. Reserved words rejected with 409.
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: Optional expiry; expired links 404 and are TTL-deleted

    Link:
      type: object
      required: [slug, url, shortUrl, createdAt, stats]
      properties:
        slug: { type: string }
        url: { type: string, format: uri }
        shortUrl: { type: string, format: uri, description: 'https://s.hamdy.app/{slug}' }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        stats:
          type: object
          required: [clicks]
          properties:
            clicks: { type: integer }
            lastClickAt: { type: [string, 'null'], format: date-time }

    Problem:
      type: object
      description: RFC 9457 Problem Details
      required: [title, status]
      properties:
        type: { type: string, format: uri, default: 'about:blank' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

  responses:
    BadRequest:
      description: Malformed request (invalid URL, bad slug pattern, oversized body)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid admin token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No such (or expired) resource
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limited
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
